<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-label="Proxmox VE walkthrough"
     font-family="Noto Sans, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a120e"/>
      <stop offset="0.55" stop-color="#120c09"/>
      <stop offset="1" stop-color="#0a0706"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E57000" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#E57000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <circle cx="900" cy="315" r="330" fill="url(#og-glow)"/>

  <!-- rack: three units with status LEDs and vents -->
  <g>
    <rect x="700" y="155" width="400" height="92" rx="12" fill="#241812" stroke="#E57000" stroke-width="3"/>
    <rect x="700" y="257" width="400" height="92" rx="12" fill="#241812" stroke="#F5A623" stroke-width="3"/>
    <rect x="700" y="359" width="400" height="92" rx="12" fill="#241812" stroke="#E57000" stroke-width="3"/>

    <circle cx="742" cy="201" r="9" fill="#E57000"/>
    <circle cx="742" cy="303" r="9" fill="#F5A623"/>
    <circle cx="742" cy="405" r="9" fill="#E57000"/>

    <g stroke-width="6" stroke-linecap="round" opacity="0.55">
      <path d="M800 201h224" stroke="#E57000"/>
      <path d="M800 303h224" stroke="#F5A623"/>
      <path d="M800 405h224" stroke="#E57000"/>
    </g>
    <g stroke="#3a2a20" stroke-width="3" stroke-linecap="round">
      <path d="M1052 181v40M1066 181v40M1080 181v40"/>
      <path d="M1052 283v40M1066 283v40M1080 283v40"/>
      <path d="M1052 385v40M1066 385v40M1080 385v40"/>
    </g>
  </g>

  <text x="72" y="112" font-size="26" font-weight="700" letter-spacing="4" fill="#F5A623">ISO TO WEB UI</text>
  <text x="70" y="210" font-size="64" font-weight="700" fill="#f4f6f8">Proxmox VE</text>
  <text x="70" y="288" font-size="64" font-weight="700" fill="#f4f6f8">walkthrough</text>
  <text x="72" y="360" font-size="28" font-weight="400" fill="#c3cbd2">From installer ISO to a web-UI-ready host.</text>
  <text x="72" y="400" font-size="28" font-weight="400" fill="#c3cbd2">Generic bare-metal prep for other labs.</text>
</svg>
